<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>VIP Player</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #08070c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #0f0e17;
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Video Area Placeholder (Anti-CLS) */
        .video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 4; /* Kunci tinggi wadah di 4:5 */
    background: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#videoPolos {
    width: 100%;
    height: 100%;
    object-fit: contain; /* Gambar utuh gak kepotong, bar durasi tetep full di bawah */
    display: block;
}

        /* Glassmorphism Play Button Overlay */
        .overlay {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 10;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .btn-play-glass {
            width: 76px;
            height: 76px;
            background: rgba(236, 72, 153, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: #ffffff;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding-left: 6px;
            animation: pulse-play 2s infinite;
            transition: transform 0.2s;
        }

        @keyframes pulse-play {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
            70% { box-shadow: 0 0 0 18px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }

        .btn-play-glass:active {
            transform: scale(0.9);
        }

        /* Server Switcher Tabs */
        .server-bar {
            display: flex;
            background: #15141f;
            padding: 8px 16px;
            gap: 10px;
            border-bottom: 1px solid #232232;
        }

        .server-btn {
            flex: 1;
            padding: 7px 0;
            background: #201f2d;
            border: 1px solid #2d2b3f;
            color: #a09cb0;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .server-btn.active {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #fff;
            border: none;
        }

        /* Nav Buttons */
        .controls-nav {
            display: flex;
            gap: 10px;
            padding: 14px 16px;
            background: #0f0e17;
        }

        .btn-nav {
            flex: 1;
            padding: 13px 0;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-prev {
            background: #201f2d;
            color: #ffffff;
            border: 1px solid #2d2b3f;
        }

        .btn-next {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
        }

        .btn-nav:active {
            transform: scale(0.96);
        }

        /* Meta Info Section */
        .info-section {
            padding: 16px;
            background: #0f0e17;
        }

        /* Live Viewers Badge */
        #liveViewers {
            font-size: 12px;
            font-weight: 900;
            color: #ff3333;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            
            
            
            
            margin-bottom: 10px;
        }

        .live-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #ff0000;
            border-radius: 50%;
            animation: kedipKamera 1.2s infinite ease-in-out;
            flex-shrink: 0;
        }

        @keyframes kedipKamera {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }

        .video-title {
            font-size: 18px;
            font-weight: 800;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .badges-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            font-size: 12px;
            color: #9ab0c7;
            flex-wrap: wrap;
        }

        .badge-pill {
            background: #8b5cf6;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 11px;
        }

        .badge-hot {
            background: #ec4899;
        }

        /* 4 Column Action Grid */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .btn-action {
            padding: 9px 0;
            background: #181724;
            color: #d1cbdc;
            border: 1px solid #262436;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }

        .btn-action i {
            color: #ec4899;
        }

        /* Telegram CTA */
        .tele-wrapper {
            padding: 0 16px 20px 16px;
        }

        .btn-telegram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 0;
            background: linear-gradient(135deg, #0088cc, #006699);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
        }

        #errorMessage {
            display: none;
            width: 100%;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: #000;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Video Wrapper (Paling Atas Layar) -->
        <div class="video-wrapper">
            <video id="videoPolos" playsinline preload="metadata">
                <source id="videoSource" src="" type="video/mp4">
            </video>

            <div id="videoOverlay" class="overlay">
                <button id="btnLanjutkan" class="btn-play-glass">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>
        </div>
        
          <!-- Live Viewers Counter (Di Atas Judul) -->
            <div id="liveViewers">
                <span class="live-dot"></span>
                <span><span id="angkaLive">0</span> Orang Sedang Menonton</span>
            </div>

        <!-- Fake Server Switcher -->
        <div class="server-bar">
            <div class="server-btn active"><i class="fa-solid fa-bolt"></i> Server 1 (Fast)</div>
            <div class="server-btn" data-ad="https://adsterra-link-server2.com"><i class="fa-solid fa-server"></i> Server 2 (HD)</div>
        </div>

        <!-- Navigation Buttons -->
        <div class="controls-nav">
            <button id="btnPrev" class="btn-nav btn-prev"><i class="fa-solid fa-arrow-left"></i> Sebelumnya</button>
            <button id="btnNext" class="btn-nav btn-next">Selanjutnya <i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <!-- Meta Info Section -->
        <div class="info-section">
            
            <h1 class="video-title"> Video Viral Full HD Uncut</h1>
            
            <div class="badges-row">
                <span class="badge-pill badge-hot">VIRAL</span>
                <span class="badge-pill">4K ULTRA HD</span>
                <span><i class="fa-solid fa-clock"></i> Updated Today</span>
            </div>

            <!-- Grid 4 Tombol Pancingan (Setiap Tombol Bisa Beda Link Iklan) -->
            <div class="action-grid">
                <button class="btn-action" data-ad="https://adsterra-link-suka.com"><i class="fa-solid fa-heart"></i> 4.8K</button>
                <button class="btn-action" data-ad="https://adsterra-link-simpan.com"><i class="fa-solid fa-bookmark"></i> Simpan</button>
                <button class="btn-action" data-ad="https://adsterra-link-unduh.com"><i class="fa-solid fa-download"></i> Unduh</button>
                <button class="btn-action" data-ad="https://adsterra-link-share.com"><i class="fa-solid fa-share-nodes"></i> Bagikan</button>
            </div>
        </div>

        <!-- Telegram Join Button -->
        <div class="tele-wrapper">
            <a href="https://t.me/+Wd9QJyO5fq9iOWQ1" target="_blank" rel="noopener noreferrer" class="btn-telegram">
                <i class="fa-brands fa-telegram"></i> JOIN TELEGRAM STOK VIRAL FULL
            </a>
        </div>
    </div>

    <div id="errorMessage">
        Video tidak ditemukan.
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            
            // 1. OTOMATISASI KLIK IKLAN UNTUK SEMUA ELEMEN 'data-ad'
            document.querySelectorAll('[data-ad]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const linkIklan = btn.getAttribute('data-ad');
                    if (linkIklan) {
                        window.open(linkIklan, '_blank');
                    }
                });
            });

            // 2. SCRIPT LIVE VIEWERS DINAMIS
            const elLive = document.getElementById("angkaLive");
            if(elLive) {        
                const jamSekarang = new Date().getHours();        
                let minViewers = 0;
                let maxViewers = 0;        
                let tingkatKeramaian = Math.floor(Math.random() * 100) + 1;

                if (jamSekarang >= 21 || jamSekarang <= 4) {
                    if (tingkatKeramaian > 80) { 
                        minViewers = 1500; maxViewers = 4500;
                    } else if (tingkatKeramaian > 30) { 
                        minViewers = 300; maxViewers = 900;
                    } else { 
                        minViewers = 15; maxViewers = 80;
                    }
                } else {           
                    if (tingkatKeramaian > 90) { 
                        minViewers = 400; maxViewers = 800;
                    } else if (tingkatKeramaian > 40) { 
                        minViewers = 50; maxViewers = 150;
                    } else { 
                        minViewers = 2; maxViewers = 25;
                    }
                }  
             
                let angkaAwal = Math.floor(Math.random() * (maxViewers - minViewers + 1)) + minViewers;
                elLive.textContent = angkaAwal.toLocaleString('id-ID');
                
                if(window.liveInterval) clearInterval(window.liveInterval);        
                window.liveInterval = setInterval(() => {
                    let batasNaikTurun = Math.floor(angkaAwal * 0.05) + 3; 
                    let perubahan = Math.floor(Math.random() * (batasNaikTurun * 2)) - batasNaikTurun; 
                    
                    angkaAwal += perubahan;
                                
                    if(angkaAwal < 2) angkaAwal = Math.floor(Math.random() * 5) + 2; 
                    
                    elLive.textContent = angkaAwal.toLocaleString('id-ID');
                }, 10000); 
            }

            // 3. LOGIKA PEMUTAR VIDEO & JEBAKAN ADSTERRA
            const params = new URLSearchParams(window.location.search);
            const slug = params.get("v");
            const video = document.getElementById("videoPolos");
            const source = document.getElementById("videoSource");
            const errorMessage = document.getElementById("errorMessage");
            
            const overlay = document.getElementById('videoOverlay');
            const btnLanjutkan = document.getElementById('btnLanjutkan');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            
            let currentStage = 1;
            let isWaitingForReturn = false;
            let isTransitioning = false;
            let videoKeys = [];

            if (!slug) {
                tampilkanError();
                return;
            }

            
            const versiAntiCache = Math.floor(Date.now() / 120000);
            const antiCacheUrl = "videos.json?v=" + versiAntiCache;

            fetch(antiCacheUrl)
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("videos.json gagal dimuat");
                    }
                    return response.json();
                })
                .then(function (data) {
                    videoKeys = Object.keys(data);

                    if (!data[slug]) {
                        tampilkanError();
                        return;
                    }

                    const videoData = data[slug];
                    source.src = videoData.video;
                    video.load();

                    setupNavigasi();
                })
                .catch(function (error) {
                    console.error(error);
                    tampilkanError();
                });

            function setupNavigasi() {
                const currentIndex = videoKeys.indexOf(slug);

                btnPrev.addEventListener('click', function () {
                    if (currentIndex > 0) {
                        const prevSlug = videoKeys[currentIndex - 1];
                        window.location.href = '?v=' + prevSlug;
                    } else {
                        const lastSlug = videoKeys[videoKeys.length - 1];
                        window.location.href = '?v=' + lastSlug;
                    }
                });

                btnNext.addEventListener('click', function () {
                    if (currentIndex < videoKeys.length - 1) {
                        const nextSlug = videoKeys[currentIndex + 1];
                        window.location.href = '?v=' + nextSlug;
                    } else {
                        const firstSlug = videoKeys[0];
                        window.location.href = '?v=' + firstSlug;
                    }
                });
            }

            function tampilkanError() {
                document.querySelector(".container").style.display = "none";
                errorMessage.style.display = "flex";
            }

            function nyalakanOverlay() {
                overlay.style.display = 'flex';
                video.removeAttribute('controls');
                video.pause();
            }

            btnLanjutkan.addEventListener('click', () => {
                // Link Adsterra Utama untuk Pemutar Video
                window.open('https://layinghypothesis.com/t7pgs2uek7?key=b4d0a9ccbdeab1ce09b94e2b66968e28', '_blank');
                
                if (currentStage === 1) {
                    isTransitioning = true;
                    currentStage = 2;
                    overlay.style.display = 'none';
                    video.setAttribute('controls', 'controls');
                    video.play();
                    
                    setTimeout(() => {
                        isTransitioning = false;
                    }, 1000);
                } else {
                    isWaitingForReturn = true;
                }
            });

            video.addEventListener('timeupdate', () => {
                if (video.currentTime >= 20 && currentStage === 2 && overlay.style.display === 'none') {
                    nyalakanOverlay();
                }
                else if (video.currentTime >= 90 && currentStage === 3 && overlay.style.display === 'none') {
                    nyalakanOverlay();
                }
            });

            video.addEventListener('pause', () => {
                if (isTransitioning || isWaitingForReturn) return;

                if (currentStage > 1 && overlay.style.display !== 'flex') {
                    nyalakanOverlay();
                }
            });

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && isWaitingForReturn) {
                    overlay.style.display = 'none'; 
                    video.setAttribute('controls', 'controls'); 
                    
                    if (currentStage === 2) {
                        currentStage = 3;
                    } else if (currentStage === 3) {
                        currentStage = 4;
                    }

                    setTimeout(() => {
                        video.play(); 
                        isWaitingForReturn = false; 
                    }, 300);
                }
            });
        });
    </script>
</body>
</html>
