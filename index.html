<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>VIP Player</title>
    <style>
        * {
            box-sizing: border-box;
       }
        
         html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: #000000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #0a0a0c;
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
       }

        #videoPolos {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
       }

        .overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .btn-play-elegan {
            padding: 8px 14px;
            background: rgba(30, 30, 35, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: #f1f1f1;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-play-elegan i {
            font-size: 11px;
            color: #e1e1e1;
        }

        .btn-play-elegan:active {
            transform: scale(0.96);
            background: rgba(50, 50, 60, 0.95);
        }

        #katalogSection {
            display: none;
            padding: 20px 16px;
        }

        .katalog-header {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1f1f26;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #e1e1e1;
        }

        .katalog-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-select-all {
            font-size: 12px;
            background: none;
            border: none;
            color: #3b82f6;
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
        }

        .katalog-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-item {
            background: #121216;
            border: 1px solid #1f1f26;
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .video-item.selected {
            border-color: rgba(59, 130, 246, 0.5);
            background: #141722;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            flex: 1;
            cursor: pointer;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .custom-checkbox i {
            display: none;
            font-size: 12px;
            color: #fff;
        }

        .video-item.selected .custom-checkbox {
            background: #2563eb;
            border-color: #3b82f6;
        }

        .video-item.selected .custom-checkbox i {
            display: block;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .video-title-katalog {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-slug-sub {
            font-size: 11px;
            color: #94a3b8;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .btn-action:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        .bulk-copy-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 448px;
            background: rgba(25, 25, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 12px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 90;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .selected-count {
            font-size: 13px;
            font-weight: 600;
            color: #e1e1e1;
        }

        .btn-bulk-copy {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .btn-bulk-copy:active {
            transform: scale(0.96);
            background: #1d4ed8;
        }

        .toast {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 35, 0.95);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: none;
            z-index: 100;
        }

        #errorMessage {
            display: none;
            padding: 40px 20px;
            text-align: center;
            color: #ff5555;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="playerSection" style="display: none;">
        <div class="video-wrapper">
            <video id="videoPolos" controls playsinline preload="metadata" muted controlslist="nodownload" disablePictureInPicture>
                <source id="videoSource" src="" type="video/mp4">
            </video>
            <div id="videoOverlay" class="overlay">
                <button id="btnLanjutkan" class="btn-play-elegan">
                    <i class="fa-solid fa-play"></i> <span>Lanjutkan Menonton</span>
                </button>
            </div>
        </div>
    </div>

    <div id="katalogSection">
        <div class="katalog-header">
            <div class="katalog-header-title">
                <i class="fa-solid fa-film" style="color: #aaa;"></i> Katalog Video Ready
            </div>
            <button class="btn-select-all" id="btnSelectAll" onclick="toggleSelectAll()">Pilih Semua</button>
        </div>
        <div class="katalog-list" id="katalogList"></div>
    </div>

    <div id="errorMessage">Video tidak ditemukan di sistem.</div>
</div>

<div id="bulkCopyBar" class="bulk-copy-bar">
    <div class="selected-count" id="selectedCountText">0 Video Terpilih</div>
    <button class="btn-bulk-copy" onclick="salinSemuaTerpilih()">
        <i class="fa-solid fa-copy"></i> Salin Link
    </button>
</div>

<div id="toast" class="toast">Link berhasil disalin! </div>

<script>
let selectedSlugs = new Set();
let allVideoData = {};

document.addEventListener("DOMContentLoaded", function () {
    const WORKER_URL = 'https://vip-trackers.zonexhub.workers.dev';
    const LINK_IKLAN = 'https://layinghypothesis.com/t7pgs2uek7?key=b4d0a9ccbdeab1ce09b94e2b66968e28';
    
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("v");

    const playerSection = document.getElementById("playerSection");
    const katalogSection = document.getElementById("katalogSection");
    const errorMessage = document.getElementById("errorMessage");
    
    const video = document.getElementById("videoPolos");
    const source = document.getElementById("videoSource");
    const overlay = document.getElementById('videoOverlay');
    const btnLanjutkan = document.getElementById('btnLanjutkan');

    let currentStage = 'Manual Pause'; 
    let stage2Done = false;
    let stage3Done = false;
    let stage4Done = false;
    let isWaitingForReturn = false;
    let sudahResetAwal = false;
    let isTransitioning = false;

    function sendTelegramLog(eventTitle, detailInfo = '') {
        if (!WORKER_URL || WORKER_URL.includes('namakamu')) return;
        const timeNow = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const message = ` <b>Lapor Bossku Aa Regge</b>\n <b>Ada Mangsa Kena Sambaran Hih</b>\n <b>Aksi:</b> ${eventTitle}\n <b>Target Video:</b> <code>${slug || 'Direct Landing'}</code>\n <b>Waktu:</b> ${timeNow}\n${detailInfo ? ` <b>Detail:</b> ${detailInfo}\n` : ''}`;

        fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        }).catch(err => console.error('Log Error:', err));
    }

    const versiAntiCache = Math.floor(Date.now() / 120000);
    fetch("videos.json?v=" + versiAntiCache)
        .then(res => { if (!res.ok) throw new Error("Gagal load video"); return res.json(); })
        .then(data => {
            allVideoData = data;
            if (!slug) {
                tampilkanKatalog(data);
                return;
            }

            if (!data[slug]) {
                tampilkanError();
                return;
            }

            putarVideoTarget(slug);
        })
        .catch(() => tampilkanError());

    function putarVideoTarget(targetSlug) {
        katalogSection.style.display = "none";
        document.getElementById("bulkCopyBar").style.display = "none";
        playerSection.style.display = "block";
        
        stage2Done = false;
        stage3Done = false;
        stage4Done = false;
        isTransitioning = false;
        
        const videoData = allVideoData[targetSlug];
        video.pause();
        video.currentTime = 0;
        video.muted = true;
        
        if (videoData.poster && videoData.poster.trim() !== "") {
            video.setAttribute('poster', videoData.poster);
        } else {
            video.removeAttribute('poster');
        }
        
        source.src = videoData.video;
        video.load();
    }

    function tampilkanKatalog(data) {
        katalogSection.style.display = "block";
        const katalogList = document.getElementById("katalogList");
        katalogList.innerHTML = "";

        const keys = Object.keys(data).reverse();

        if (keys.length === 0) {
            katalogList.innerHTML = "<div style='text-align:center; color:#888;'>Belum ada video di videos.json</div>";
            return;
        }

        keys.forEach(key => {
            let formattedTitle = key.replace(/[-_]/g, ' ');
            formattedTitle = formattedTitle.charAt(0).toUpperCase() + formattedTitle.slice(1);

            const baseUrl = window.location.origin + window.location.pathname;
            const fullVideoUrl = `${baseUrl}?v=${key}`;

            const item = document.createElement("div");
            item.className = "video-item";
            item.setAttribute("id", `item-${key}`);

            item.innerHTML = `
                <div class="item-left" onclick="toggleSelectVideo('${key}')">
                    <div class="custom-checkbox">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="video-info">
                        <div class="video-title-katalog">${formattedTitle}</div>
                        <div class="video-slug-sub">?v=${key}</div>
                    </div>
                </div>
                <div class="item-actions">
                    <button class="btn-action" onclick="bukaVideoDirect('${key}')" title="Tonton Video">
                        <i class="fa-solid fa-play"></i> Buka
                    </button>
                    <button class="btn-action" onclick="salinSatuLink('${fullVideoUrl}')" title="Salin Link">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </div>
            `;
            katalogList.appendChild(item);
        });
    }

    function tampilkanError() {
        errorMessage.style.display = "block";
    }

    function nyalakanOverlay() {
        isTransitioning = true;
        video.pause();
        video.removeAttribute('controls');
        overlay.style.display = 'flex';

        setTimeout(() => {
            isTransitioning = false;
        }, 1000);
    }

    btnLanjutkan.addEventListener('click', () => {
        sendTelegramLog('Klik Lanjutkan Menonton', `Stage: ${currentStage}`);
        window.open(LINK_IKLAN, '_blank');
        isWaitingForReturn = true;
    });

    video.addEventListener('play', () => {
        video.muted = false;
        if (!sudahResetAwal) {
            video.currentTime = 0;
            sudahResetAwal = true;
        }
    });

    video.addEventListener('pause', () => {
        if (!isTransitioning && !isWaitingForReturn && video.currentTime > 0.5 && video.currentTime < video.duration - 0.5) {
            currentStage = `Sengaja Pause (detik ${Math.floor(video.currentTime)})`;
            nyalakanOverlay();
        }
    });

    video.addEventListener('timeupdate', () => {
        if (video.currentTime >= 60 && !stage2Done) {
            stage2Done = true;
            currentStage = 'Stage 2 (60 Detik)';
            nyalakanOverlay();
        } 
        else if (video.currentTime >= 120 && !stage3Done) {
            stage3Done = true;
            currentStage = 'Stage 3 (120 Detik)';
            nyalakanOverlay();
        }
        else if (video.currentTime >= 180 && !stage4Done) {
            stage4Done = true;
            currentStage = 'Stage 4 (180 Detik)';
            nyalakanOverlay();
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isWaitingForReturn) {
            overlay.style.display = 'none';
            video.setAttribute('controls', 'controls');

            isTransitioning = true;
            setTimeout(() => {
                video.play();
                isWaitingForReturn = false;
                setTimeout(() => { isTransitioning = false; }, 1000);
            }, 300);
        }
    });
});

function bukaVideoDirect(key) {
    window.location.href = `?v=${key}`;
}

function toggleSelectVideo(slugKey) {
    const item = document.getElementById(`item-${slugKey}`);
    if (selectedSlugs.has(slugKey)) {
        selectedSlugs.delete(slugKey);
        item.classList.remove('selected');
    } else {
        selectedSlugs.add(slugKey);
        item.classList.add('selected');
    }
    updateBulkBar();
}

function toggleSelectAll() {
    const keys = Object.keys(allVideoData);
    const btnSelectAll = document.getElementById("btnSelectAll");
    
    if (selectedSlugs.size === keys.length) {
        selectedSlugs.clear();
        keys.forEach(key => {
            const item = document.getElementById(`item-${key}`);
            if(item) item.classList.remove('selected');
        });
        btnSelectAll.innerText = "Pilih Semua";
    } else {
        keys.forEach(key => {
            selectedSlugs.add(key);
            const item = document.getElementById(`item-${key}`);
            if(item) item.classList.add('selected');
        });
        btnSelectAll.innerText = "Batal Pilih";
    }
    updateBulkBar();
}

function updateBulkBar() {
    const bulkBar = document.getElementById("bulkCopyBar");
    const textCount = document.getElementById("selectedCountText");
    const count = selectedSlugs.size;

    if (count > 0) {
        textCount.innerText = `${count} Video Terpilih`;
        bulkBar.style.display = "flex";
    } else {
        bulkBar.style.display = "none";
    }
}

function salinSatuLink(url) {
    prosesSalin(url);
}

function salinSemuaTerpilih() {
    const baseUrl = window.location.origin + window.location.pathname;
    let listUrl = [];
    
    selectedSlugs.forEach(key => {
        listUrl.push(`${baseUrl}?v=${key}`);
    });

    const hasillink = listUrl.join("\n\n");
    prosesSalin(hasillink);
}

function prosesSalin(text) {
    navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById("toast");
        toast.style.display = "block";
        setTimeout(() => { toast.style.display = "none"; }, 2000);
    }).catch(err => {
        alert("Gagal menyalin link: " + err);
    });
}
</script>
</body>
</html>
