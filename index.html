    (function() {
        const domainUtama = "play.zonexhub.net"; 
        const hostSekarang = window.location.hostname;

        if (hostSekarang !== domainUtama) {
            window.location.href = "https://" + domainUtama;

    document.addEventListener('contextmenu', function(e) {
        if (typeof isEditMode !== 'undefined' && !isEditMode) {
            e.preventDefault();
        }
    });  
    
    document.onkeydown = function(e) {              
        if (typeof isEditMode !== 'undefined' && !isEditMode) {
            if(e.keyCode == 123) { 
                return false;
            }       
            if((e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || 
               (e.metaKey && e.altKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67))) {
                return false;
            }          
            if((e.ctrlKey && e.keyCode == 85) || (e.metaKey && e.altKey && e.keyCode == 85)) { 
                return false;
            }         
            if((e.ctrlKey && e.keyCode == 83) || (e.metaKey && e.keyCode == 83)) { 
                return false;
            }
        }
    };
</script>

<script>
let selectedSlugs = new Set();
let allVideoData = {};
let filteredKeys = [];
let activeFolderSlugs = []; 
let isFromFolder = false; 
let isDirectShare = false;

let currentPage = 1;
const ITEMS_PER_PAGE = 10;
let isSelectMode = false;
let currentPlayingSlug = "";

function getRandomViews(key) {
    const keys = Object.keys(allVideoData).reverse();
    const index = keys.indexOf(key);
    const total = keys.length;
    if (index === -1) return "32.4k";
    const minViews = 32.4;
    const maxViews = 240.0;
    const progress = total > 1 ? index / (total - 1) : 0;
    const views = minViews + (progress * (maxViews - minViews));
    return `${views.toFixed(1)}k`;
}

document.addEventListener("DOMContentLoaded", function () {
    const WORKER_URL = 'https://katalog-video.zonexhub.workers.dev';
    const LINK_IKLAN = 'https://layinghypothesis.com/t7pgs2uek7?key=b4d0a9ccbdeab1ce09b94e2b66968e28';
    
    const params = new URLSearchParams(window.location.search);
    const rawSlugParam = params.get("video");
    const pageFromUrl = parseInt(params.get("page")) || 1;

    const mainContainer = document.getElementById("mainContainer");
    const playerSection = document.getElementById("playerSection");
    const katalogSection = document.getElementById("katalogSection");
    const errorMessage = document.getElementById("errorMessage");
    
    const video = document.getElementById("videoPolos");
    const source = document.getElementById("videoSource");
    const overlay = document.getElementById('videoOverlay');
    const btnLanjutkan = document.getElementById('btnLanjutkan');

    const searchInput = document.getElementById("searchInput");
    const searchClearBtn = document.getElementById("searchClearBtn");
    const btnToggleSearch = document.getElementById("btnToggleSearch");
    const searchBoxContainer = document.getElementById("searchBoxContainer");
    const btnHomeFolder = document.getElementById("btnHomeFolder");
    const katalogIcon = document.getElementById("katalogIcon");
    const btnSelectMode = document.getElementById("btnSelectMode");

    let currentStage = 'Manual Pause'; 
    let stage2Done = false;
    let stage3Done = false;
    let stage4Done = false;
    let isWaitingForReturn = false;
    let sudahResetAwal = false;
    let isTransitioning = false;

    btnToggleSearch.addEventListener("click", () => {
        searchBoxContainer.style.display = "flex";
        searchInput.focus();
    });

    searchInput.addEventListener("input", function () {
        filterKatalog(this.value.trim());
    });

    searchClearBtn.addEventListener("click", function () {
        searchInput.value = "";
        searchBoxContainer.style.display = "none";
        filterKatalog("");
    });
    
    const elLiveHome = document.getElementById("angkaLiveHome");
    const boxLiveHome = document.getElementById("liveUserHome");
    
    window.intervalLiveHome = null; 
    
    if (params.get("video") && params.get("video").split(',').length > 1) {
        if (boxLiveHome) boxLiveHome.style.display = "none";
    } 
    else if (elLiveHome && !rawSlugParam) {        
        
        let angkaAwal;
        let memoriLive = sessionStorage.getItem("ingatanLiveZoneX");

        if (memoriLive) {
            angkaAwal = parseInt(memoriLive);
        } else {
            const jamSekarang = new Date().getHours();        
            let minViewers = 0, maxViewers = 0;        
            let tingkatKeramaian = Math.floor(Math.random() * 100) + 1;

            if (jamSekarang >= 21 || jamSekarang <= 4) {
                if (tingkatKeramaian > 80) { minViewers = 1500; maxViewers = 4500; } 
                else if (tingkatKeramaian > 30) { minViewers = 300; maxViewers = 900; } 
                else { minViewers = 15; maxViewers = 80; }
            } else {           
                if (tingkatKeramaian > 90) { minViewers = 400; maxViewers = 800; } 
                else if (tingkatKeramaian > 40) { minViewers = 50; maxViewers = 150; } 
                else { minViewers = 2; maxViewers = 25; }
            }  
            angkaAwal = Math.floor(Math.random() * (maxViewers - minViewers + 1)) + minViewers;
            
            sessionStorage.setItem("ingatanLiveZoneX", angkaAwal);
        }
     
        elLiveHome.textContent = angkaAwal.toLocaleString('id-ID');
        
        window.intervalLiveHome = setInterval(() => {
            let batasNaikTurun = Math.floor(angkaAwal * 0.05) + 3; 
            let perubahan = Math.floor(Math.random() * (batasNaikTurun * 2)) - batasNaikTurun; 
            
            angkaAwal += perubahan;
            if(angkaAwal < 2) angkaAwal = Math.floor(Math.random() * 5) + 2; 
            
            elLiveHome.textContent = angkaAwal.toLocaleString('id-ID');
            
            sessionStorage.setItem("ingatanLiveZoneX", angkaAwal);
        }, 10000); 
    }
    
    function sendTelegramLog(eventTitle, detailInfo = '') {
        if (!WORKER_URL || WORKER_URL.includes('namakamu')) return;
      
        const safeStr = (str) => {
            if (!str && str !== 0) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        };

        const timeNow = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        const targetVideo = safeStr(currentPlayingSlug || rawSlugParam || 'Direct Landing');
        const safeTitle = safeStr(eventTitle);
        const safeDetail = safeStr(detailInfo);

        let message = `🫡 <b>Lapor Bossku Aa Regge</b>\n\n`;
        message += `🔥 <b>Ada Mangsa Kena Sambaran Hih</b>\n`;
        message += `📌 <b>Aksi:</b> ${safeTitle}\n`;
        message += `🎬 <b>Target Video:</b> <code>${targetVideo}</code>\n`;
        message += `⏰ <b>Waktu:</b> ${timeNow}\n`;
        if (safeDetail) {
            message += `📝 <b>Detail:</b> ${safeDetail}\n`;
        }

        fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message }),
            keepalive: true 
        }).catch(err => console.error('Log Error:', err));
    }

    const versiAntiCache = Math.floor(Date.now() / 120000);
    fetch("videos.json?video=" + versiAntiCache)
        .then(res => { if (!res.ok) throw new Error("Gagal load video"); return res.json(); })
        .then(data => {
            allVideoData = data;
            
            if (!rawSlugParam) {
                initKatalogData(data, pageFromUrl);
                return;
            }

            const slugList = rawSlugParam.split(',').map(s => s.trim()).filter(s => s.length > 0);

            if (slugList.length === 1) {
                const singleSlug = slugList[0];
                if (!data[singleSlug]) {
                    tampilkanError();
                    return;
                }

                const hasSavedScroll = sessionStorage.getItem("savedKatalogScroll");
                if (!hasSavedScroll) {
                    isDirectShare = true; 
                }

                currentPlayingSlug = singleSlug;
                putarVideoTarget(singleSlug);
            } else if (slugList.length > 1) {
                isFromFolder = true;
                activeFolderSlugs = slugList.filter(s => data[s]);
                if (activeFolderSlugs.length === 0) {
                    tampilkanError();
                    return;
                }
                
                const rawTitleParam = params.get("title");
                let judulFolderTampil = `Folder Video`; 
              
                if (rawTitleParam) {
                    judulFolderTampil = decodeURIComponent(rawTitleParam).replace(/-/g, ' ');
                }

                const katalogLogo = document.querySelector('.katalog-header-title img');
                const katalogTextTitle = document.querySelector('.katalog-text-title');

                if (katalogLogo) katalogLogo.style.display = "none";
                if (katalogTextTitle) katalogTextTitle.style.display = "flex";

                katalogIcon.className = "fa-solid fa-folder-open"; 
                katalogIcon.style.color = "#ffd75e";

                document.getElementById("katalogTitleText").innerText = `${judulFolderTampil} (${activeFolderSlugs.length})`;
                
                btnToggleSearch.style.display = "none";
                btnSelectMode.style.display = "none";
                btnHomeFolder.style.display = "inline-flex";
                
                initKatalogData(data, pageFromUrl, activeFolderSlugs);
            }
        })
        .catch(() => tampilkanError());

    function putarVideoTarget(targetSlug) {
        currentPlayingSlug = targetSlug;
        mainContainer.classList.remove("mode-katalog");
        mainContainer.classList.add("mode-player");

        katalogSection.style.display = "none";
        document.getElementById("bulkCopyBar").style.display = "none";
        playerSection.style.display = "block";
        
       if (window.intervalLiveHome) {
            clearInterval(window.intervalLiveHome);
            window.intervalLiveHome = null;
        }

        btnLanjutkan.querySelector('span').innerText = "Lanjutkan Menonton";
        btnLanjutkan.querySelector('i').className = "fa-solid fa-play";
        btnLanjutkan.querySelector('i').style.display = "inline-block";
        
        stage2Done = false;
        stage3Done = false;
        stage4Done = false;
        isTransitioning = false;
        sudahResetAwal = false;
        
        const videoData = allVideoData[targetSlug];
        video.pause();
        video.currentTime = 0;
        video.muted = true;
        
        if (videoData.poster && videoData.poster.trim() !== "") {
            video.setAttribute('poster', videoData.poster);
        } else {
            video.removeAttribute('poster');
        }
        
        source.src = videoData.video;
        video.load();
    }

    function initKatalogData(data, startPage = 1, folderFilter = null) {
        mainContainer.classList.remove("mode-player");
        mainContainer.classList.add("mode-katalog");
        errorMessage.style.display = "none";

        katalogSection.style.display = "block";
        
        if (folderFilter && folderFilter.length > 0) {
            filteredKeys = folderFilter;
        } else {
            filteredKeys = Object.keys(data).reverse();
        }
        
        currentPage = startPage;
        renderKatalogPage(true);
    }

    function filterKatalog(query) {
        const baseKeys = activeFolderSlugs.length > 0 ? activeFolderSlugs : Object.keys(allVideoData).reverse();
        if (!query) {
            filteredKeys = baseKeys;
        } else {
            const q = query.toLowerCase();
            filteredKeys = baseKeys.filter(key => {
                const title = key.replace(/[-_]/g, ' ').toLowerCase();
                return title.includes(q) || key.toLowerCase().includes(q);
            });
        }
        currentPage = 1;
        renderKatalogPage();
    }

    function nyalakanOverlay() {
        isTransitioning = true;
        video.pause();
        video.removeAttribute('controls');
        overlay.style.display = 'flex';

        setTimeout(() => {
            isTransitioning = false;
        }, 1000);
    }

    btnLanjutkan.addEventListener('click', () => {
        if (currentStage === 'Selesai') {
            if (pageFromUrl > 1) {
                window.location.href = window.location.pathname + '?page=' + pageFromUrl;
            } else {
                window.location.href = window.location.pathname;
            }
            return;
        }

        sendTelegramLog('Klik Lanjutkan Menonton', `Stage: ${currentStage}`);
        
        const link = document.createElement('a');
        link.href = LINK_IKLAN;
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        isWaitingForReturn = true;
    });

    video.addEventListener('play', () => {
        video.muted = false;
        if (!sudahResetAwal) {
            video.currentTime = 0;
            sudahResetAwal = true;
        }
    });

    video.addEventListener('pause', () => {
        if (!isTransitioning && !isWaitingForReturn && video.currentTime > 0.5 && video.currentTime < video.duration - 0.5) {
            currentStage = `Sengaja Pause (detik ${Math.floor(video.currentTime)})`;
            nyalakanOverlay();
        }
    });

    video.addEventListener('ended', () => {
        currentStage = 'Selesai';
        isTransitioning = true;
        video.pause();
        
        video.controls = false;
        
        if (isDirectShare && !isFromFolder) {
            btnLanjutkan.innerHTML = `<i class="fa-solid fa-photo-film"></i> <span>Tonton Video Lainnya</span>`;
            overlay.style.display = 'flex';
        } else {
            overlay.style.display = 'none';
            video.setAttribute('controls', 'controls');
        }

        setTimeout(() => {
            isTransitioning = false;
        }, 1000);
    });

    video.addEventListener('timeupdate', () => {
        if (video.currentTime >= 25 && !stage2Done) {
            stage2Done = true;
            currentStage = 'Stage 2 (25 Detik)';
            nyalakanOverlay();
        } 
        else if (video.currentTime >= 90 && !stage3Done) {
            stage3Done = true;
            currentStage = 'Stage 3 (90 Detik)';
            nyalakanOverlay();
        }
        else if (video.currentTime >= 180 && !stage4Done) {
            stage4Done = true;
            currentStage = 'Stage 4 (180 Detik)';
            nyalakanOverlay();
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isWaitingForReturn) {
            overlay.style.display = 'none';
            video.setAttribute('controls', 'controls');

            isTransitioning = true;
            setTimeout(() => {
                video.play().catch(() => {
                    video.muted = true;
                    video.play();
                });
                isWaitingForReturn = false;
                setTimeout(() => { isTransitioning = false; }, 1000);
            }, 300);
        }
    });
});

function goHome() {
    window.location.href = window.location.pathname;
}

function renderKatalogPage(restoreScroll = false) {
    const katalogList = document.getElementById("katalogList");
    const paginationContainer = document.getElementById("paginationContainer");
    katalogList.innerHTML = "";

    if (filteredKeys.length === 0) {
        katalogList.innerHTML = "<div style='text-align:center; color:#888; padding:30px 0;'>Video tidak ditemukan.</div>";
        paginationContainer.style.display = "none";
        return;
    }

    const totalPages = Math.ceil(filteredKeys.length / ITEMS_PER_PAGE);
    if (currentPage > totalPages) currentPage = totalPages;

    const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
    const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, filteredKeys.length);
    const pageKeys = filteredKeys.slice(startIndex, endIndex);

    pageKeys.forEach((key, index) => {
        const dataItem = allVideoData[key];
        if(!dataItem) return;

        let formattedTitle = key.replace(/[-_]/g, ' ');
        formattedTitle = formattedTitle.replace(/(ID\s+\S+\s+)(.*)/i, (match, prefix, rest) => {
            return prefix + "= " + rest.replace(/\b\w/g, char => char.toUpperCase());
        });

        const isChecked = selectedSlugs.has(key) ? 'selected' : '';

        const item = document.createElement("div");
        item.className = `video-item ${isChecked}`;
        item.setAttribute("id", `item-${key}`);
        item.setAttribute("onclick", `handleItemClick('${key}')`);

        let thumbHtml = `<div class="thumb-box"><i class="fa-solid fa-play"></i></div>`;
        if (dataItem.poster && dataItem.poster.trim() !== "") {
            thumbHtml = `<div class="thumb-box"><img src="${dataItem.poster}" alt="thumb" loading="lazy"></div>`;
        }

        let tagHtml = '';
        if (currentPage === 1 && index < 5) {
            tagHtml = `
                <div class="video-tag-container">
                    <span class="badge-tag new"><i class="fa-solid fa-bolt"></i> NEW</span>
                    <span class="badge-tag hot"><i class="fa-solid fa-fire"></i> HOT</span>
                    <span class="badge-tag hd"><i class="fa-solid fa-compact-disc"></i> 1080p</span>
                </div>
            `;
        } else {
            tagHtml = `
                <div class="video-tag-container">
                    <span class="badge-tag hd"><i class="fa-solid fa-compact-disc"></i> 1080p</span>
                    <span class="views-text"><i class="fa-regular fa-eye"></i> ${getRandomViews(key)}</span>
                </div>
            `;
        }

        item.innerHTML = `
            <div class="custom-checkbox">
                <i class="fa-solid fa-check"></i>
            </div>
            ${thumbHtml}
            <div class="video-info">
                <div class="video-title-katalog">${formattedTitle}</div>
                <div class="video-slug-sub">?video=${key}</div>
                ${tagHtml}
            </div>
        `;
        katalogList.appendChild(item);
    });

    if (totalPages > 1) {
        paginationContainer.style.display = "flex";

        let optionsHtml = '';
        for (let i = 1; i <= totalPages; i++) {
            optionsHtml += `<option value="${i}" ${i === currentPage ? 'selected' : ''}>Page ${i} dari ${totalPages}</option>`;
        }

        paginationContainer.innerHTML = `
            <select class="page-select" onchange="pilihHalaman(this.value)">
                ${optionsHtml}
            </select>
            <div class="pagination-buttons">
                <button class="btn-page" id="btnPrevPage" onclick="gantiHalaman(-1)" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fa-solid fa-chevron-left"></i> Prev
                </button>
                <button class="btn-page" id="btnNextPage" onclick="gantiHalaman(1)" ${currentPage === totalPages ? 'disabled' : ''}>
                    Next <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        `;
    } else {
        paginationContainer.style.display = "none";
    }

    if (restoreScroll) {
        const savedScrollPos = sessionStorage.getItem("savedKatalogScroll");
        if (savedScrollPos) {
            setTimeout(() => {
                window.scrollTo(0, parseInt(savedScrollPos));
                sessionStorage.removeItem("savedKatalogScroll");
            }, 50);
        }
    }
}

function pilihHalaman(page) {
    currentPage = parseInt(page);
    renderKatalogPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    const baseUrl = window.location.pathname;
    history.pushState({ page: currentPage }, "", `${baseUrl}?page=${currentPage}`);
}

function handleItemClick(key) {
    if (isSelectMode) {
        toggleSelectVideo(key);
    } else {
        bukaVideoDirect(key);
    }
}

function gantiHalaman(direction) {
    currentPage += direction;
    renderKatalogPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    const baseUrl = window.location.pathname;
    history.pushState({ page: currentPage }, "", `${baseUrl}?page=${currentPage}`);
}

function toggleSelectMode() {
    isSelectMode = !isSelectMode;
    const katalogSection = document.getElementById("katalogSection");
    const btnSelectMode = document.getElementById("btnSelectMode");

    if (isSelectMode) {
        katalogSection.classList.add("select-mode-active");
        btnSelectMode.classList.add("active");
        btnSelectMode.innerText = "Batal";
    } else {
        katalogSection.classList.remove("select-mode-active");
        btnSelectMode.classList.remove("active");
        btnSelectMode.innerText = "Pilih";
        selectedSlugs.clear();
        updateBulkBar();
        renderKatalogPage();
    }
}

function toggleSelectVideo(slugKey) {
    const item = document.getElementById(`item-${slugKey}`);
    if (selectedSlugs.has(slugKey)) {
        selectedSlugs.delete(slugKey);
        if (item) item.classList.remove('selected');
    } else {
        selectedSlugs.add(slugKey);
        if (item) item.classList.add('selected');
    }
    updateBulkBar();
}

function updateBulkBar() {
    const bulkBar = document.getElementById("bulkCopyBar");
    const textCount = document.getElementById("selectedCountText");
    const count = selectedSlugs.size;

    if (count > 0 && isSelectMode) {
        textCount.innerText = `${count} Video Terpilih`;
        bulkBar.style.display = "flex";
    } else {
        bulkBar.style.display = "none";
    }
}

function bukaVideoDirect(key) {
    sessionStorage.setItem("savedKatalogScroll", window.scrollY.toString());
    if (currentPage > 1) {
        window.location.href = `?video=${key}&page=${currentPage}`;
    } else {
        window.location.href = `?video=${key}`;
    }
}

function salinSebagaiFolder() {
    const baseUrl = window.location.origin + window.location.pathname;
    const selectedArray = Array.from(selectedSlugs);
    if (selectedArray.length === 0) return;
    
    let namaFolder = prompt("Masukkan Nama Folder (Contoh: Kumpulan Skandal SMA):");
    
    if (!namaFolder || namaFolder.trim() === "") {
        namaFolder = "Folder Video";
    }

    let titleParam = encodeURIComponent(namaFolder.trim().replace(/ /g, '-'));
    const folderParam = selectedArray.join(',');
    
    const folderUrl = `${baseUrl}?video=${folderParam}&title=${titleParam}`;
    
    prosesSalin(folderUrl, '<i class="fa-solid fa-folder-closed"></i> Link Folder berhasil disalin!');
}

function salinSemuaTerpilih() {
    const baseUrl = window.location.origin + window.location.pathname;
    const keys = Object.keys(allVideoData).reverse(); 
    let listUrl = [];
    keys.forEach(key => {
        if (selectedSlugs.has(key)) {
            listUrl.push(`${baseUrl}?video=${key}`);
        }
    });
    const hasillink = listUrl.join("\n\n");
    prosesSalin(hasillink, '<i class="fa-solid fa-copy"></i> Link Disalin!');
}

function prosesSalin(text, customMessage = '<i class="fa-solid fa-check"></i> Link berhasil disalin!') {
    navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById("toast");
        toast.innerHTML = customMessage;
        toast.style.display = "block";
        setTimeout(() => { toast.style.display = "none"; }, 2000);
    }).catch(err => {
        alert("Gagal menyalin link: " + err);
    });
}

function tampilkanError() {
    const mainContainer = document.getElementById("mainContainer");
    const errorMessage = document.getElementById("errorMessage");
    mainContainer.classList.remove("mode-player");
    mainContainer.classList.add("mode-katalog");
    errorMessage.style.display = "block";
}

let hitungKlik = 0;
let resetTimer = null;
const PASS_BASE64 = "QW5qaXI=";

const titleHeader = document.querySelector('.katalog-header-title');
const btnSelectMode = document.getElementById('btnSelectMode');
const btnHomeFolder = document.getElementById('btnHomeFolder');

if (titleHeader) {
    titleHeader.addEventListener('click', function() {
        const isDiDalamFolder = btnHomeFolder && getComputedStyle(btnHomeFolder).display !== 'none';
        if (isDiDalamFolder) return;

        hitungKlik++;

        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => { hitungKlik = 0; }, 1000);

        if (hitungKlik === 20) {
            hitungKlik = 0;
            const inputPass = prompt("Masukkan Password Buat Share Link:");

            if (inputPass && btoa(inputPass) === PASS_BASE64) {
                alert("Mode Share Link Aktif!");
                if (btnSelectMode) {
                    btnSelectMode.style.display = "inline-block";
                }
            } else if (inputPass !== null) {
                alert("Password Salah!");
            }
        }
    });
}
